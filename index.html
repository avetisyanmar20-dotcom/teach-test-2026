    let currentIdx = 0;
    // Ժամանակավոր փոփոխական՝ ընթացիկ ընտրությունը պահելու համար մինչև կոճակը սեղմելը
    let tempSelected = null;

    function initTest() {
        const grid = document.getElementById('questionGrid');
        grid.innerHTML = '';
        questions.forEach((q, idx) => {
            const btn = document.createElement('button');
            const isAnswered = q.multiple ? (q.selected && q.selected.length > 0) : (q.selected !== null);
            btn.className = `q-btn ${idx === 0 ? 'current' : ''} ${isAnswered ? 'answered' : ''}`;
            btn.innerText = q.id;
            btn.onclick = () => selectQuestion(idx);
            grid.appendChild(btn);
        });
        loadQuestion(currentIdx);
    }

    function loadQuestion(idx) {
        currentIdx = idx;
        const q = questions[idx];
        document.getElementById('questionTitle').innerText = `${q.title} ${q.text}`;
        
        // Բեռնում ենք արդեն պահպանված պատասխանը ժամանակավոր դաշտ
        tempSelected = q.multiple ? (q.selected ? [...q.selected] : []) : q.selected;

        const list = document.getElementById('optionsList');
        list.innerHTML = '';
        
        q.options.forEach((opt, oIdx) => {
            const label = document.createElement('label');
            label.className = 'option-item';
            
            if (q.multiple) {
                const isChecked = tempSelected && tempSelected.includes(oIdx);
                label.innerHTML = `
                    <input type="checkbox" ${isChecked ? 'checked' : ''} onclick="handleMultipleClick(${oIdx}, this)">
                    <span>${opt}</span>
                `;
            } else {
                const isChecked = tempSelected === oIdx;
                label.innerHTML = `
                    <input type="radio" name="option" ${isChecked ? 'checked' : ''} onclick="handleSingleClick(${oIdx})">
                    <span>${opt}</span>
                `;
            }
            list.appendChild(label);
        });

        updateGrid();
    }

    function handleSingleClick(oIdx) {
        tempSelected = oIdx;
    }

    function handleMultipleClick(oIdx, checkbox) {
        if (!Array.isArray(tempSelected)) {
            tempSelected = [];
        }
        if (checkbox.checked) {
            if (!tempSelected.includes(oIdx)) {
                tempSelected.push(oIdx);
            }
        } else {
            tempSelected = tempSelected.filter(item => item !== oIdx);
        }
    }

    // Այս ֆունկցիան աշխատում է, երբ սեղմում են «Պահպանել պատասխանը» կոճակը
    function saveCurrentAnswer() {
        questions[currentIdx].selected = tempSelected;
        updateGrid();
        alert("Պատասխանը հաջողությամբ պահպանվեց։");
    }

    function updateGrid() {
        const buttons = document.querySelectorAll('.q-btn');
        buttons.forEach((btn, idx) => {
            const q = questions[idx];
            const isAnswered = q.multiple ? (q.selected && q.selected.length > 0) : (q.selected !== null);
            btn.className = `q-btn ${idx === currentIdx ? 'current' : ''} ${isAnswered ? 'answered' : ''}`;
        });
    }

    function nextQuestion() {
        if (currentIdx < questions.length - 1) loadQuestion(currentIdx + 1);
    }

    function prevQuestion() {
        if (currentIdx > 0) loadQuestion(currentIdx - 1);
    }

    function selectQuestion(idx) {
        loadQuestion(idx);
    }

    function finishTest() {
        let score = 0;
        questions.forEach(q => {
            if (q.multiple) {
                if (q.selected && q.selected.length > 0) {
                    const sortedSelected = [...q.selected].sort();
                    const sortedCorrect = [...q.correct].sort();
                    if (JSON.stringify(sortedSelected) === JSON.stringify(sortedCorrect)) {
                        score++;
                    }
                }
            } else {
                if (q.selected === q.correct[0]) {
                    score++;
                }
            }
        });
        alert(`Թեստը ավարտված է։ Ձեր միավորը՝ ${score} / ${questions.length}`);
    }

    // Ժամանակացույց (3 ժամ)
    let totalSeconds = 3 * 3600;
    setInterval(() => {
        if (totalSeconds > 0) {
            totalSeconds--;
            let h = Math.floor(totalSeconds / 3600);
            let m = Math.floor((totalSeconds % 3600) / 60);
            let s = totalSeconds % 60;
            document.getElementById('timer').innerText = 
                String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
        }
    }, 1000);

    initTest();
</script>
